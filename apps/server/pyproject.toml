[project]
name = "codemates-server"
version = "0.1.0"
description = "Codemates backend — Agno agents + FastAPI"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.4.8",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "fastmcp>=3.1.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
